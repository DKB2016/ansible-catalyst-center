name: Sandbox integration
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration-testing')
    runs-on: ubuntu-latest
    env:
      CC_HOST: https://sandboxdnac.cisco.com
      CC_VERIFY: "false"
      CC_USERNAME: ${{ secrets.CC_USERNAME }}
      CC_PASSWORD: ${{ secrets.CC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install ansible-core==2.19.4
      - run: ansible-playbook playbooks/preflight.yml --syntax-check
      - run: ansible-playbook playbooks/preflight.yml
      - run: python -m compileall -q tests
      - run: pytest -q -rP --junitxml=results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: results.xml
