---
- name: Validate controller settings
  ansible.builtin.assert:
    that:
      - cc_host is string
      - cc_host is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
      - cc_mode == 'read_only'
      - cc_verify is boolean
      - cc_verify or cc_host in ['https://sandboxdnac.cisco.com', 'https://sandboxdnac2.cisco.com']
      - cc_environment in ['sandbox', 'lab', 'production']
      - cc_desired_state is mapping
      - cc_desired_state | length == 0
    fail_msg: Invalid controller settings or unsupported desired state.
- name: Validate required credentials
  ansible.builtin.assert:
    that:
      - cc_username is string
      - cc_password is string
      - cc_username | trim | length > 0
      - cc_password | trim | length > 0
  no_log: true
- name: Validate probe selection
  ansible.builtin.assert:
    that:
      - cc_preflight_probe | default(false) is boolean
      - cc_require_compatibility | default(false) is boolean
      - not (cc_require_compatibility | default(false)) or (cc_preflight_probe | default(false))
      - not (cc_require_compatibility | default(false)) or cc_expected_release is defined
      - cc_expected_release is not defined or (cc_expected_release is string and cc_expected_release is match('^[0-9]+[.][0-9]+[.][0-9]+([.][0-9]+)?$'))
- name: Report local validation evidence
  ansible.builtin.debug:
    msg:
      connectivity: not_requested
      release_compatibility: unverified
      tls_verification_enabled: "{{ cc_verify }}"
  when: not (cc_preflight_probe | default(false))
- name: Probe controller connectivity
  when: cc_preflight_probe | default(false)
  block:
    - name: Obtain authentication token
      ansible.builtin.uri:
        url: "{{ cc_host }}/dna/system/api/v1/auth/token"
        method: POST
        url_username: "{{ cc_username }}"
        url_password: "{{ cc_password }}"
        force_basic_auth: true
        validate_certs: "{{ cc_verify }}"
        follow_redirects: none
        use_netrc: false
        timeout: 30
        status_code: 200
      register: cc_preflight_auth
      no_log: true
    - name: Validate authentication response
      ansible.builtin.assert:
        that:
          - cc_preflight_auth.json.Token is defined
          - cc_preflight_auth.json.Token is string
          - cc_preflight_auth.json.Token | trim | length > 0
      no_log: true
    - name: Read controller inventory count
      ansible.builtin.uri:
        url: "{{ cc_host }}/dna/intent/api/v1/network-device/count"
        method: GET
        headers:
          X-Auth-Token: "{{ cc_preflight_auth.json.Token }}"
        validate_certs: "{{ cc_verify }}"
        follow_redirects: none
        use_netrc: false
        timeout: 30
        status_code: 200
      register: cc_preflight_count
      no_log: true
    - name: Validate inventory response
      ansible.builtin.assert:
        that:
          - cc_preflight_count.json.response is defined
          - cc_preflight_count.json.response is integer
          - cc_preflight_count.json.response >= 0
      no_log: true
    - name: Read controller release
      ansible.builtin.uri:
        url: "{{ cc_host }}/dna/intent/api/v1/dnac-release"
        method: GET
        headers:
          X-Auth-Token: "{{ cc_preflight_auth.json.Token }}"
        validate_certs: "{{ cc_verify }}"
        follow_redirects: none
        use_netrc: false
        timeout: 30
        status_code: 200
      register: cc_preflight_release
      no_log: true
    - name: Validate release response
      ansible.builtin.assert:
        that:
          - cc_preflight_release.json.response.installedVersion is string
          - cc_preflight_release.json.response.installedVersion is match('^[0-9]+[.][0-9]+[.][0-9]+([.][0-9]+)?$')
      no_log: true
    - name: Validate release against explicit deployment expectation
      ansible.builtin.assert:
        that:
          - cc_expected_release is not defined or cc_expected_release == cc_preflight_release.json.response.installedVersion
        fail_msg: Installed controller release differs from the deployment expectation.
    - name: Reject unverified native compatibility when required
      ansible.builtin.assert:
        that:
          - not (cc_require_compatibility | default(false))
        fail_msg: Native collection and SDK compatibility has not been verified for this release.
    - name: Report connectivity evidence
      ansible.builtin.debug:
        msg:
          connectivity: passed
          authentication: passed
          tls_verification_enabled: "{{ cc_verify }}"
          installed_version: "{{ cc_preflight_release.json.response.installedVersion }}"
          release_expectation: "{{ 'matched' if cc_expected_release is defined else 'not_configured' }}"
          release_compatibility: unverified
  rescue:
    - name: Report controlled probe failure
      ansible.builtin.fail:
        msg: Controller preflight probe failed. Check connectivity, TLS, credentials and API permissions.
